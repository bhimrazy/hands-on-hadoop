<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
<title id="title">Row-based versus columnar file formats, and small files</title>
<desc id="desc">The same four rows stored as CSV row by row, and as Parquet or ORC column by column. A query for the average amount must read all of the CSV but only the amount column of the columnar file. Below, many small files cost far more NameNode memory than a few large ones.</desc>
