<text x="264" y="286" class="s">avg(amount) reads only the amount column. The footer holds the</text>
<text x="264" y="305" class="s">schema and min/max stats, so whole chunks can be skipped.</text>
<rect x="32" y="336" width="736" height="200" rx="14" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
