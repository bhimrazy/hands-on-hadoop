<text x="63" y="162" class="b" text-anchor="middle">Oslo</text>
<rect x="32" y="172" width="62" height="30" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="63" y="192" class="b" text-anchor="middle">Lima</text>
