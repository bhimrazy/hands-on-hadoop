<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
<title id="title">Streaming from Kafka into HDFS with Spark</title>
<desc id="desc">A console producer sends lines to the Kafka topic 'lines'. Spark Structured Streaming in the notebook reads new offsets in micro-batches and appends Parquet files to HDFS, recording progress in a checkpoint.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.t{font-size:21px;font-weight:700}
.st{font-size:14px;fill:#5f6877}
.h{font-size:15px;font-weight:600}
.hs{font-size:14px;font-weight:600}
.b{font-size:14px}
.s{font-size:13.5px;fill:#5f6877}
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13.5px}
.ms{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13.5px;fill:#5f6877}
.n{font-size:13px;font-weight:700;fill:#ffffff}</style>
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.08"/></filter><marker id="a334155" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5 0.8 L9 5 L0.5 9.2 z" fill="#334155"/></marker><marker id="af5b301" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5 0.8 L9 5 L0.5 9.2 z" fill="#f5b301"/></marker></defs>
<rect width="800" height="460" fill="#ffffff"/>
<text x="32" y="44" class="t">Streaming from Kafka into HDFS</text>
<text x="32" y="68" class="st">Spark reads new messages in small batches and appends them to HDFS as Parquet.</text>
<rect x="32" y="104" width="156" height="210" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#sh)"/>
<text x="48" y="130" class="h">Producer</text>
<text x="48" y="152" class="s">console producer</text>
<rect x="44" y="168" width="132" height="128" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
<text x="54" y="192" class="m">&gt; hello hadoop</text>
<text x="54" y="218" class="m">&gt; hello kafka</text>
<text x="54" y="244" class="m">&gt; spark reads</text>
<text x="54" y="270" class="m">&gt; …</text>
<rect x="216" y="104" width="208" height="210" rx="12" fill="#eef2f6" stroke="#334155" stroke-width="1.5" filter="url(#sh)"/>
<text x="232" y="130" class="h">kafka</text>
<text x="408" y="130" class="s" text-anchor="end">KRaft · kafka:9092</text>
<text x="232" y="164" class="hs">topic: lines</text>
<text x="232" y="184" class="s">one partition, append-only</text>
<rect x="232" y="200" width="26" height="34" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="245" y="222" class="m" text-anchor="middle">0</text>
<rect x="261" y="200" width="26" height="34" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="274" y="222" class="m" text-anchor="middle">1</text>
<rect x="290" y="200" width="26" height="34" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="303" y="222" class="m" text-anchor="middle">2</text>
<rect x="319" y="200" width="26" height="34" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="332" y="222" class="m" text-anchor="middle">3</text>
<rect x="348" y="200" width="26" height="34" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="361" y="222" class="m" text-anchor="middle">4</text>
<rect x="377" y="200" width="26" height="34" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="390" y="222" class="m" text-anchor="middle">5</text>
<path d="M232 239 v4 h113 v-4" fill="none" stroke="#e8590c" stroke-width="1.5" stroke-linejoin="round"/>
<text x="288.5" y="260" class="s" text-anchor="middle" style="fill:#c2410c">batch 1</text>
<path d="M348 239 v4 h55 v-4" fill="none" stroke="#e8590c" stroke-width="1.5" stroke-linejoin="round"/>
<text x="375.5" y="260" class="s" text-anchor="middle" style="fill:#c2410c">batch 2</text>
<text x="232" y="283" class="s">Messages stay after they are</text>
<text x="232" y="302" class="s">read; readers track offsets.</text>
<path d="M188 210 L214 210" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a334155)"/>
<rect x="452" y="104" width="160" height="210" rx="12" fill="#fff1e8" stroke="#e8590c" stroke-width="1.5" filter="url(#sh)"/>
<text x="468" y="130" class="h">Spark</text>
<text x="468" y="150" class="s">Structured Streaming</text>
<text x="468" y="169" class="s">in the notebook</text>
<rect x="468" y="186" width="128" height="50" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="1.4"/>
<text x="482" y="207" class="hs">batch 1</text>
<text x="482" y="226" class="s">offsets 0–3</text>
<rect x="468" y="246" width="128" height="50" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="1.4"/>
<text x="482" y="267" class="hs">batch 2</text>
<text x="482" y="286" class="s">offsets 4–5</text>
<path d="M424 217 L450 217" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a334155)"/>
<rect x="640" y="104" width="128" height="210" rx="12" fill="#fff7db" stroke="#f5b301" stroke-width="1.5" filter="url(#sh)"/>
<text x="656" y="130" class="h">HDFS</text>
<rect x="652" y="146" width="104" height="70" rx="8" fill="#ffffff" stroke="#f5b301" stroke-width="1.4"/>
<text x="664" y="168" class="hs">data</text>
<text x="664" y="188" class="s">Parquet files</text>
<text x="664" y="206" class="s">per batch</text>
<rect x="652" y="228" width="104" height="70" rx="8" fill="#ffffff" stroke="#f5b301" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="664" y="250" class="hs">checkpoint</text>
<text x="664" y="270" class="s">offsets/</text>
<text x="664" y="288" class="s">commits/</text>
<path d="M612 181 L650 181" fill="none" stroke="#f5b301" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#af5b301)"/>
<path d="M612 263 L650 263" fill="none" stroke="#f5b301" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#af5b301)"/>
<rect x="32" y="346" width="736" height="84" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
<text x="48" y="372" class="h">Stop the query and start it again</text>
<text x="48" y="394" class="s">Spark reads the checkpoint, sees offsets 0–5 are done and continues at offset 6.</text>
<text x="48" y="413" class="s">Nothing is read twice and nothing is skipped. A new checkpoint folder starts from scratch.</text>
</svg>
