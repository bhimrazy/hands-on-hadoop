<svg xmlns="http://www.w3.org/2000/svg" width="800" height="690" viewBox="0 0 800 690" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
<title id="title">Architecture of the hands-on-hadoop stack</title>
<desc id="desc">Your browser reaches Caddy on 127.0.0.1 port 80, which routes each *.localhost name to a container. The core (namenode, datanode, resourcemanager, nodemanager) is always on; add-on profiles history, cluster, notebook, hive and kafka start only when asked.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.t{font-size:21px;font-weight:700}
.st{font-size:14px;fill:#6b7280}
.h{font-size:15px;font-weight:600}
.hs{font-size:14px;font-weight:600}
.b{font-size:14px}
.s{font-size:13px;fill:#6b7280}
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px}
.ms{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px;fill:#6b7280}
.n{font-size:13px;font-weight:700;fill:#ffffff}</style>
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.08"/></filter><marker id="a6b7280" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5 0.8 L9 5 L0.5 9.2 z" fill="#6b7280"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5 0.8 L9 5 L0.5 9.2 z" fill="#7c3aed"/></marker></defs>
<rect width="800" height="690" fill="#ffffff"/>
<text x="32" y="44" class="t">How the lab fits together</text>
<text x="32" y="68" class="st">Caddy routes every *.localhost name to a container. Add-ons start only when you ask for them.</text>
<rect x="32" y="96" width="196" height="64" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#sh)"/>
<rect x="48" y="111" width="22" height="17" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><line x1="48" y1="116" x2="70" y2="116" stroke="#6b7280" stroke-width="1.5"/>
<text x="80" y="124" class="h">Your browser</text>
<text x="48" y="147" class="ms">http://hdfs.localhost</text>
<rect x="296" y="96" width="216" height="64" rx="12" fill="#f1ecff" stroke="#7c3aed" stroke-width="1.5" filter="url(#sh)"/>
<text x="404" y="123" class="h" text-anchor="middle">Caddy proxy</text>
<text x="404" y="143" class="s" text-anchor="middle">127.0.0.1:80 · *.localhost</text>
<rect x="580" y="96" width="188" height="64" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#sh)"/>
<rect x="596" y="111" width="22" height="17" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><path d="M601 116 L605 119.5 L601 123" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="607" y1="123" x2="613" y2="123" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
<text x="628" y="124" class="h">Your terminal</text>
<text x="596" y="147" class="ms">docker compose exec</text>
<path d="M228 128 L294 128" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a7c3aed)"/>
<rect x="20" y="194" width="760" height="446" rx="16" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="36" y="218" class="hs" style="fill:#6b7280">Docker network</text>
<path d="M404 160 L404 232" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a7c3aed)"/>
<text x="414" y="190" class="s">routes by hostname</text>
<path d="M674 160 L674 232" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#a6b7280)"/>
<text x="684" y="190" class="s">exec</text>
<rect x="36" y="234" width="728" height="148" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="52" y="246" width="49.9" height="22" rx="11.0" fill="#9ca3af" stroke="#9ca3af" stroke-width="1.2"/>
