<text x="137" y="332" class="h" text-anchor="middle">namenode</text>
<text x="137" y="352" class="s" text-anchor="middle">hdfs.localhost</text>
<rect x="226" y="306" width="170" height="62" rx="12" fill="#fff7db" stroke="#f5b301" stroke-width="1.5" filter="url(#sh)"/>
<text x="311" y="332" class="h" text-anchor="middle">datanode</text>
<text x="311" y="352" class="s" text-anchor="middle">dn1.localhost</text>
<rect x="404" y="306" width="170" height="62" rx="12" fill="#e8efff" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/>
<text x="489" y="332" class="h" text-anchor="middle">resourcemanager</text>
<text x="489" y="352" class="s" text-anchor="middle">yarn.localhost</text>
<rect x="578" y="306" width="170" height="62" rx="12" fill="#e8efff" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/>
<text x="663" y="332" class="h" text-anchor="middle">nodemanager</text>
<text x="663" y="352" class="s" text-anchor="middle">nodemanager.localhost</text>
<rect x="36" y="398" width="728" height="226" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
