<text x="116" y="528" class="s" text-anchor="middle">history.localhost</text>
<rect x="194" y="446" width="128" height="136" rx="12" fill="#fff7db" stroke="#f5b301" stroke-width="1.5" filter="url(#sh)"/>
<rect x="221.838" y="458" width="72.325" height="22" rx="11.0" fill="#f5b301" stroke="#f5b301" stroke-width="1.2"/>
<text x="258" y="473.5" class="s" text-anchor="middle" style="fill:#ffffff;font-weight:600">cluster</text>
<text x="258" y="506" class="hs" text-anchor="middle">datanode2, 3</text>
