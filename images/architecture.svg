<text x="400" y="506" class="hs" text-anchor="middle">notebook</text>
<text x="400" y="528" class="s" text-anchor="middle">Jupyter + Spark</text>
<text x="400" y="547" class="s" text-anchor="middle">jupyter.localhost</text>
<text x="400" y="566" class="s" text-anchor="middle">spark.localhost</text>
<rect x="478" y="446" width="128" height="136" rx="12" fill="#fdf3e2" stroke="#b45309" stroke-width="1.5" filter="url(#sh)"/>
<rect x="517.05" y="458" width="49.9" height="22" rx="11.0" fill="#b45309" stroke="#b45309" stroke-width="1.2"/>
<text x="542" y="473.5" class="s" text-anchor="middle" style="fill:#ffffff;font-weight:600">hive</text>
<text x="542" y="506" class="hs" text-anchor="middle">hiveserver2</text>
<text x="542" y="528" class="s" text-anchor="middle">hive.localhost</text>
<text x="542" y="547" class="s" text-anchor="middle">beeline :10000</text>
<rect x="620" y="446" width="128" height="136" rx="12" fill="#eef2f6" stroke="#334155" stroke-width="1.5" filter="url(#sh)"/>
<rect x="655.312" y="458" width="57.375" height="22" rx="11.0" fill="#334155" stroke="#334155" stroke-width="1.2"/>
<text x="684" y="473.5" class="s" text-anchor="middle" style="fill:#ffffff;font-weight:600">kafka</text>
<text x="684" y="506" class="hs" text-anchor="middle">kafka</text>
<text x="684" y="528" class="s" text-anchor="middle">kafka:9092</text>
