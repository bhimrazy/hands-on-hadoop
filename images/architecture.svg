<text x="88.1625" y="425.5" class="s" text-anchor="middle" style="fill:#ffffff;font-weight:600">add-ons</text>
<text x="134.325" y="426" class="s">one at a time: docker compose --profile &lt;name&gt; up -d --wait</text>
<rect x="52" y="446" width="128" height="136" rx="12" fill="#e8efff" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/>
