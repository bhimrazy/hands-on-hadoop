<text x="111.9" y="262" class="s">always on: docker compose up -d --wait</text>
<text x="52" y="296" class="hs" style="fill:#8a5a00">HDFS · storage</text>
<text x="404" y="296" class="hs" style="fill:#1d4ed8">YARN · compute</text>
