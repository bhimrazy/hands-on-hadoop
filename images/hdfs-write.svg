<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
<title id="title">How a file is written to HDFS</title>
<desc id="desc">A 300 MB file is split into 128 MB blocks. The client asks the NameNode where to put each block, streams it to a DataNode, and that DataNode copies it to a second one. DataNodes send heartbeats and block reports.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.t{font-size:21px;font-weight:700}
.st{font-size:14px;fill:#6b7280}
.h{font-size:15px;font-weight:600}
.hs{font-size:14px;font-weight:600}
.b{font-size:14px}
.s{font-size:13px;fill:#6b7280}
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px}
.ms{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px;fill:#6b7280}
.n{font-size:13px;font-weight:700;fill:#ffffff}</style>
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.08"/></filter><marker id="a6b7280" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5 0.8 L9 5 L0.5 9.2 z" fill="#6b7280"/></marker><marker id="af5b301" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5 0.8 L9 5 L0.5 9.2 z" fill="#f5b301"/></marker></defs>
<rect width="800" height="650" fill="#ffffff"/>
<text x="32" y="44" class="t">Writing a file to HDFS</text>
<text x="32" y="68" class="st">The NameNode keeps the map. The DataNodes keep the bytes.</text>
<text x="32" y="106" class="h">sales.csv · 300 MB</text>
<rect x="32" y="118" width="149.6" height="38" rx="6" fill="#fff7db" stroke="#f5b301" stroke-width="1.5"/>
<text x="106.8" y="142" class="hs" text-anchor="middle">B1 · 128 MB</text>
<rect x="185.6" y="118" width="149.6" height="38" rx="6" fill="#fff7db" stroke="#f5b301" stroke-width="1.5"/>
<text x="260.4" y="142" class="hs" text-anchor="middle">B2 · 128 MB</text>
<rect x="339.2" y="118" width="48.8" height="38" rx="6" fill="#fff7db" stroke="#f5b301" stroke-width="1.5"/>
<text x="363.6" y="142" class="hs" text-anchor="middle">B3</text>
<text x="32" y="178" class="s">Split into 128 MB blocks. The last one is smaller.</text>
<rect x="32" y="202" width="360" height="66" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#sh)"/>
<text x="48" y="228" class="h">Client</text>
<text x="48" y="252" class="m">hdfs dfs -put sales.csv /data/</text>
<rect x="448" y="96" width="320" height="200" rx="12" fill="#fff7db" stroke="#f5b301" stroke-width="1.5" filter="url(#sh)"/>
<text x="466" y="122" class="h">NameNode</text>
<text x="750" y="122" class="s" text-anchor="end">hdfs.localhost</text>
<rect x="466" y="136" width="284" height="116" rx="8" fill="#ffffff" stroke="#f5b301" stroke-width="1"/>
<text x="480" y="158" class="m">/data/sales.csv  (2 copies)</text>
<line x1="466" y1="168" x2="750" y2="168" stroke="#f3e3b0" stroke-width="1" stroke-linecap="round"/>
<text x="480" y="190" class="m" style="fill:#8a5a00">B1</text>
<text x="512" y="190" class="m">→ dn1, dn2</text>
<text x="480" y="212" class="m" style="fill:#8a5a00">B2</text>
<text x="512" y="212" class="m">→ dn2, dn3</text>
<text x="480" y="234" class="m" style="fill:#8a5a00">B3</text>
<text x="512" y="234" class="m">→ dn3, dn1</text>
<text x="466" y="278" class="s">Metadata only, kept in memory.</text>
<path d="M392 220 L446 220" fill="none" stroke="#f5b301" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#af5b301)"/>
<path d="M446 250 L392 250" fill="none" stroke="#f5b301" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#af5b301)"/>
<circle cx="419" cy="208" r="11" fill="#f5b301" stroke="#ffffff" stroke-width="2"/>
<text x="419" y="212.5" class="n" text-anchor="middle">1</text>
<circle cx="419" cy="262" r="11" fill="#f5b301" stroke="#ffffff" stroke-width="2"/>
<text x="419" y="266.5" class="n" text-anchor="middle">2</text>
<rect x="32" y="380" width="208" height="104" rx="12" fill="#ffffff" stroke="#f5b301" stroke-width="1.5" filter="url(#sh)"/>
<text x="48" y="404" class="h">dn1</text>
<text x="224" y="404" class="s" text-anchor="end">DataNode</text>
<rect x="48" y="424" width="60" height="40" rx="5" fill="#fff7db" stroke="#f5b301" stroke-width="1.3"/>
<text x="78" y="448.5" class="s" text-anchor="middle" style="fill:#1f2937">B1</text>
<rect x="118" y="424" width="60" height="40" rx="5" fill="#fff7db" stroke="#f5b301" stroke-width="1.3"/>
<text x="148" y="448.5" class="s" text-anchor="middle" style="fill:#1f2937">B3</text>
<rect x="296" y="380" width="208" height="104" rx="12" fill="#ffffff" stroke="#f5b301" stroke-width="1.5" filter="url(#sh)"/>
<text x="312" y="404" class="h">dn2</text>
<text x="488" y="404" class="s" text-anchor="end">DataNode</text>
<rect x="312" y="424" width="60" height="40" rx="5" fill="#fff7db" stroke="#f5b301" stroke-width="1.3"/>
<text x="342" y="448.5" class="s" text-anchor="middle" style="fill:#1f2937">B1</text>
<rect x="382" y="424" width="60" height="40" rx="5" fill="#fff7db" stroke="#f5b301" stroke-width="1.3"/>
<text x="412" y="448.5" class="s" text-anchor="middle" style="fill:#1f2937">B2</text>
<rect x="560" y="380" width="208" height="104" rx="12" fill="#ffffff" stroke="#f5b301" stroke-width="1.5" filter="url(#sh)"/>
<text x="576" y="404" class="h">dn3</text>
<text x="752" y="404" class="s" text-anchor="end">DataNode</text>
<rect x="576" y="424" width="60" height="40" rx="5" fill="#fff7db" stroke="#f5b301" stroke-width="1.3"/>
<text x="606" y="448.5" class="s" text-anchor="middle" style="fill:#1f2937">B2</text>
<rect x="646" y="424" width="60" height="40" rx="5" fill="#fff7db" stroke="#f5b301" stroke-width="1.3"/>
<text x="676" y="448.5" class="s" text-anchor="middle" style="fill:#1f2937">B3</text>
<path d="M78 268 L78 422" fill="none" stroke="#f5b301" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#af5b301)"/>
<circle cx="78" cy="330" r="11" fill="#f5b301" stroke="#ffffff" stroke-width="2"/>
<text x="78" y="334.5" class="n" text-anchor="middle">3</text>
<text x="94" y="335" class="s">stream B1</text>
<path d="M240 444 L294 444" fill="none" stroke="#f5b301" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#af5b301)"/>
<circle cx="267" cy="444" r="11" fill="#f5b301" stroke="#ffffff" stroke-width="2"/>
<text x="267" y="448.5" class="n" text-anchor="middle">4</text>
<path d="M468 378 L468 298" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#a6b7280)"/>
<path d="M664 378 L664 298" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#a6b7280)"/>
<circle cx="468" cy="338" r="11" fill="#9ca3af" stroke="#ffffff" stroke-width="2"/>
<text x="468" y="342.5" class="n" text-anchor="middle">5</text>
<circle cx="664" cy="338" r="11" fill="#9ca3af" stroke="#ffffff" stroke-width="2"/>
<text x="664" y="342.5" class="n" text-anchor="middle">5</text>
<circle cx="44" cy="515" r="10" fill="#f5b301" stroke="#ffffff" stroke-width="2"/>
<text x="44" y="519.5" class="n" text-anchor="middle">1</text>
<text x="64" y="520" class="b">Client asks the NameNode where block B1 should go.</text>
<circle cx="44" cy="537" r="10" fill="#f5b301" stroke="#ffffff" stroke-width="2"/>
<text x="44" y="541.5" class="n" text-anchor="middle">2</text>
<text x="64" y="542" class="b">NameNode answers with a list of DataNodes: dn1, then dn2.</text>
<circle cx="44" cy="559" r="10" fill="#f5b301" stroke="#ffffff" stroke-width="2"/>
<text x="44" y="563.5" class="n" text-anchor="middle">3</text>
<text x="64" y="564" class="b">Client streams B1 to dn1, in small packets.</text>
<circle cx="44" cy="581" r="10" fill="#f5b301" stroke="#ffffff" stroke-width="2"/>
<text x="44" y="585.5" class="n" text-anchor="middle">4</text>
<text x="64" y="586" class="b">dn1 forwards each packet to dn2 (the write pipeline), then both acknowledge.</text>
<circle cx="44" cy="603" r="10" fill="#9ca3af" stroke="#ffffff" stroke-width="2"/>
<text x="44" y="607.5" class="n" text-anchor="middle">5</text>
<text x="64" y="608" class="b">Every DataNode sends heartbeats (every 3 s) and reports which blocks it holds.</text>
<text x="32" y="636" class="s">Lab 01 runs one DataNode, so each block has a single copy. Lab 04 adds dn2 and dn3.</text>
</svg>
