<svg xmlns="http://www.w3.org/2000/svg" width="800" height="664" viewBox="0 0 800 664" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
<title id="title">What HDFS does when a DataNode dies</title>
<desc id="desc">Four panels with three DataNodes and replication 2. dn2 stops, heartbeats stop, after about 90 seconds the NameNode marks it dead and copies the under-replicated blocks to the remaining DataNodes.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.t{font-size:21px;font-weight:700}
.st{font-size:14px;fill:#5f6877}
.h{font-size:15px;font-weight:600}
.hs{font-size:14px;font-weight:600}
.b{font-size:14px}
.s{font-size:13.5px;fill:#5f6877}
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13.5px}
.ms{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13.5px;fill:#5f6877}
.n{font-size:13px;font-weight:700;fill:#ffffff}</style>
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.08"/></filter></defs>
