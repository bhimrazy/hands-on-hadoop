<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
<title id="title">Iceberg snapshots and time travel</title>
<desc id="desc">Three commits make three snapshots. Each snapshot lists the data files it contains; files are shared between snapshots and old ones are kept, so a query can read an earlier snapshot. On HDFS the table is a data folder and a metadata folder.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.t{font-size:21px;font-weight:700}
.st{font-size:14px;fill:#6b7280}
.h{font-size:15px;font-weight:600}
.hs{font-size:14px;font-weight:600}
.b{font-size:14px}
.s{font-size:13px;fill:#6b7280}
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px}
.ms{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px;fill:#6b7280}
.n{font-size:13px;font-weight:700;fill:#ffffff}</style>
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.08"/></filter><marker id="a0d9488" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5 0.8 L9 5 L0.5 9.2 z" fill="#0d9488"/></marker></defs>
<rect width="800" height="540" fill="#ffffff"/>
<text x="32" y="44" class="t">Iceberg snapshots and time travel</text>
<text x="32" y="68" class="st">Every write makes a new snapshot. Old snapshots still point at their files, so you can read the past.</text>
<rect x="32" y="130" width="148" height="112" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" filter="url(#sh)"/>
<text x="48" y="156" class="h">snapshot 1</text>
<text x="48" y="180" class="m" style="fill:#0f766e">INSERT</text>
<rect x="48" y="196" width="26" height="28" rx="6" fill="#fff7db" stroke="#f5b301" stroke-width="1.3"/>
<text x="61" y="215" class="m" text-anchor="middle">a</text>
<rect x="80" y="196" width="26" height="28" rx="6" fill="#fff7db" stroke="#f5b301" stroke-width="1.3"/>
<text x="93" y="215" class="m" text-anchor="middle">b</text>
<path d="M182 186 L208 186" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a0d9488)"/>
<rect x="210" y="130" width="148" height="112" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" filter="url(#sh)"/>
<text x="226" y="156" class="h">snapshot 2</text>
<text x="226" y="180" class="m" style="fill:#0f766e">INSERT</text>
<rect x="226" y="196" width="26" height="28" rx="6" fill="#fff7db" stroke="#f5b301" stroke-width="1.3"/>
<text x="239" y="215" class="m" text-anchor="middle">a</text>
<rect x="258" y="196" width="26" height="28" rx="6" fill="#fff7db" stroke="#f5b301" stroke-width="1.3"/>
<text x="271" y="215" class="m" text-anchor="middle">b</text>
<rect x="290" y="196" width="26" height="28" rx="6" fill="#fff7db" stroke="#f5b301" stroke-width="1.3"/>
<text x="303" y="215" class="m" text-anchor="middle">c</text>
<path d="M360 186 L386 186" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a0d9488)"/>
<rect x="388" y="130" width="148" height="112" rx="12" fill="#e6f7f5" stroke="#0d9488" stroke-width="2" filter="url(#sh)"/>
<text x="404" y="156" class="h">snapshot 3</text>
<text x="404" y="180" class="m" style="fill:#0f766e">UPDATE</text>
<rect x="404" y="196" width="26" height="28" rx="6" fill="#fff7db" stroke="#f5b301" stroke-width="1.3"/>
<text x="417" y="215" class="m" text-anchor="middle">a</text>
<rect x="436" y="196" width="26" height="28" rx="6" fill="#fff7db" stroke="#f5b301" stroke-width="1.3"/>
<text x="449" y="215" class="m" text-anchor="middle">c</text>
<rect x="468" y="196" width="34" height="28" rx="6" fill="#fff7db" stroke="#f5b301" stroke-width="1.3"/>
<text x="485" y="215" class="m" text-anchor="middle">b2</text>
<rect x="425.837" y="100" width="72.325" height="22" rx="11.0" fill="#0d9488" stroke="#0d9488" stroke-width="1.2"/>
<text x="462" y="115.5" class="s" text-anchor="middle" style="fill:#ffffff;font-weight:600">current</text>
<rect x="54.8875" y="100" width="102.225" height="22" rx="11.0" fill="#e6f7f5" stroke="#0d9488" stroke-width="1.2"/>
<text x="106" y="115.5" class="s" text-anchor="middle" style="fill:#0f766e;font-weight:600">time travel</text>
<text x="32" y="266" class="s">Each snapshot lists the data files it reads. Unchanged files are shared, not copied.</text>
<text x="32" y="292" class="hs">data/ in HDFS</text>
<rect x="32" y="304" width="104" height="40" rx="8" fill="#fff7db" stroke="#f5b301" stroke-width="1.5"/>
<text x="84" y="329" class="m" text-anchor="middle">a.parquet</text>
<rect x="160" y="304" width="104" height="40" rx="8" fill="#ffffff" stroke="#f5b301" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="212" y="329" class="m" text-anchor="middle">b.parquet</text>
<rect x="288" y="304" width="104" height="40" rx="8" fill="#fff7db" stroke="#f5b301" stroke-width="1.5"/>
<text x="340" y="329" class="m" text-anchor="middle">c.parquet</text>
<rect x="416" y="304" width="104" height="40" rx="8" fill="#fff7db" stroke="#f5b301" stroke-width="1.5"/>
<text x="468" y="329" class="m" text-anchor="middle">b2.parquet</text>
<text x="160" y="364" class="s">not in snapshot 3,</text>
<text x="160" y="383" class="s">kept for time travel</text>
<text x="32" y="412" class="h">Read an older snapshot</text>
<rect x="32" y="424" width="504" height="62" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
<text x="48" y="450" class="m">SELECT * FROM db.orders</text>
<text x="48" y="472" class="m" xml:space="preserve">  VERSION AS OF &lt;snapshot 1 id&gt;;</text>
<text x="376" y="461" class="s">→ reads a, b</text>
<rect x="568" y="96" width="200" height="390" rx="12" fill="#e6f7f5" stroke="#0d9488" stroke-width="1.5" filter="url(#sh)"/>
<text x="584" y="122" class="h">On HDFS</text>
<text x="584" y="150" class="m" style="fill:#0f766e">orders/</text>
<text x="598" y="172" class="m" style="fill:#0f766e">data/</text>
<text x="612" y="194" class="m" style="fill:#1f2937">a.parquet</text>
<text x="612" y="216" class="m" style="fill:#1f2937">b.parquet</text>
<text x="612" y="238" class="m" style="fill:#1f2937">…</text>
<text x="598" y="260" class="m" style="fill:#0f766e">metadata/</text>
<text x="612" y="282" class="m" style="fill:#1f2937">v1.metadata.json</text>
<text x="612" y="304" class="m" style="fill:#1f2937">…</text>
<text x="612" y="326" class="m" style="fill:#1f2937">v4.metadata.json</text>
<text x="612" y="348" class="m" style="fill:#1f2937">version-hint.text</text>
<text x="612" y="370" class="m" style="fill:#1f2937">snap-*.avro</text>
<text x="612" y="392" class="m" style="fill:#1f2937">*-m0.avro</text>
<text x="584" y="428" class="s">version-hint.text names</text>
<text x="584" y="447" class="s">the current metadata.json.</text>
<text x="584" y="470" class="s">One new file per commit.</text>
<text x="32" y="520" class="s">Iceberg on a Hadoop catalog: the table is just files in HDFS, written by Spark in the notebook.</text>
</svg>
