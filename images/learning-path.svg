<svg xmlns="http://www.w3.org/2000/svg" width="800" height="668" viewBox="0 0 800 668" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
<title id="title">Learning path for the 10 labs</title>
<desc id="desc">Labs 01 and 02 are beginner, 03 to 07 intermediate, 08 to 10 advanced. Each card names the compose profile it needs.</desc>
