<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
<title id="title">Spark in the notebook container reading HDFS</title>
<desc id="desc">The notebook container runs JupyterLab and a Spark driver in local mode. The driver asks the NameNode for block locations, tasks running as threads read blocks from the DataNode and write results back. YARN is not used.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.t{font-size:21px;font-weight:700}
.st{font-size:14px;fill:#6b7280}
.h{font-size:15px;font-weight:600}
.hs{font-size:14px;font-weight:600}
.b{font-size:14px}
.s{font-size:13px;fill:#6b7280}
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px}
.ms{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px;fill:#6b7280}
.n{font-size:13px;font-weight:700;fill:#ffffff}</style>
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.08"/></filter><marker id="ae8590c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5 0.8 L9 5 L0.5 9.2 z" fill="#e8590c"/></marker><marker id="af5b301" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5 0.8 L9 5 L0.5 9.2 z" fill="#f5b301"/></marker></defs>
<rect width="800" height="560" fill="#ffffff"/>
<text x="32" y="44" class="t">Spark in the notebook, data in HDFS</text>
<text x="32" y="68" class="st">Spark runs in local mode inside the notebook container. It uses HDFS, not YARN.</text>
<rect x="32" y="96" width="196" height="92" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#sh)"/>
<text x="48" y="122" class="h">Your browser</text>
<text x="48" y="146" class="m">jupyter.localhost</text>
<text x="48" y="168" class="m">spark.localhost</text>
<path d="M228 142 L262 142" fill="none" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ae8590c)"/>
<text x="32" y="222" class="s">spark.localhost is the</text>
<text x="32" y="241" class="s">Spark UI (port 4040) of</text>
<text x="32" y="260" class="s">the running session.</text>
<rect x="264" y="96" width="300" height="300" rx="12" fill="#fff1e8" stroke="#e8590c" stroke-width="1.5" filter="url(#sh)"/>
<text x="284" y="122" class="h">notebook container</text>
<text x="284" y="142" class="s">JupyterLab + PySpark</text>
<rect x="284" y="160" width="260" height="66" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="1.5"/>
<text x="414" y="188" class="hs" text-anchor="middle">Driver</text>
<text x="414" y="208" class="s" text-anchor="middle">SparkSession, master local[*]</text>
<rect x="284" y="262" width="260" height="116" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="1.5"/>
<text x="414" y="286" class="hs" text-anchor="middle">Tasks</text>
<rect x="300" y="302" width="48" height="34" rx="6" fill="#fff1e8" stroke="#e8590c" stroke-width="1.2"/>
<text x="324" y="324" class="s" text-anchor="middle" style="fill:#c2410c">t1</text>
<rect x="360" y="302" width="48" height="34" rx="6" fill="#fff1e8" stroke="#e8590c" stroke-width="1.2"/>
<text x="384" y="324" class="s" text-anchor="middle" style="fill:#c2410c">t2</text>
<rect x="420" y="302" width="48" height="34" rx="6" fill="#fff1e8" stroke="#e8590c" stroke-width="1.2"/>
<text x="444" y="324" class="s" text-anchor="middle" style="fill:#c2410c">t3</text>
<rect x="480" y="302" width="48" height="34" rx="6" fill="#fff1e8" stroke="#e8590c" stroke-width="1.2"/>
<text x="504" y="324" class="s" text-anchor="middle" style="fill:#c2410c">t4</text>
<text x="414" y="362" class="s" text-anchor="middle">threads in the same JVM</text>
<path d="M414 226 L414 260" fill="none" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ae8590c)"/>
<rect x="612" y="96" width="156" height="300" rx="12" fill="#fff7db" stroke="#f5b301" stroke-width="1.5" filter="url(#sh)"/>
<text x="628" y="122" class="h">HDFS</text>
<rect x="628" y="140" width="124" height="72" rx="10" fill="#ffffff" stroke="#f5b301" stroke-width="1.5"/>
<text x="690" y="170" class="hs" text-anchor="middle">namenode</text>
<text x="690" y="190" class="s" text-anchor="middle">block map</text>
<rect x="628" y="262" width="124" height="116" rx="10" fill="#ffffff" stroke="#f5b301" stroke-width="1.5"/>
<text x="690" y="286" class="hs" text-anchor="middle">datanode</text>
<rect x="640" y="302" width="30" height="26" rx="5" fill="#fff7db" stroke="#f5b301" stroke-width="1.2"/>
<text x="655" y="320" class="s" text-anchor="middle" style="fill:#1f2937">B1</text>
<rect x="676" y="302" width="30" height="26" rx="5" fill="#fff7db" stroke="#f5b301" stroke-width="1.2"/>
<text x="691" y="320" class="s" text-anchor="middle" style="fill:#1f2937">B2</text>
<rect x="712" y="302" width="30" height="26" rx="5" fill="#fff7db" stroke="#f5b301" stroke-width="1.2"/>
<text x="727" y="320" class="s" text-anchor="middle" style="fill:#1f2937">B3</text>
<text x="690" y="362" class="s" text-anchor="middle">block bytes</text>
<path d="M544 186 L626 186" fill="none" stroke="#f5b301" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#af5b301)"/>
<circle cx="585" cy="186" r="11" fill="#f5b301" stroke="#ffffff" stroke-width="2"/>
<text x="585" y="190.5" class="n" text-anchor="middle">1</text>
<path d="M626 304 L546 304" fill="none" stroke="#f5b301" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#af5b301)"/>
<circle cx="585" cy="304" r="11" fill="#f5b301" stroke="#ffffff" stroke-width="2"/>
<text x="585" y="308.5" class="n" text-anchor="middle">2</text>
<path d="M544 344 L626 344" fill="none" stroke="#f5b301" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#af5b301)"/>
<circle cx="585" cy="344" r="11" fill="#f5b301" stroke="#ffffff" stroke-width="2"/>
<text x="585" y="348.5" class="n" text-anchor="middle">3</text>
<rect x="264" y="414" width="504" height="40" rx="10" fill="#ffffff" stroke="#c7cdd6" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="284" y="439" class="hs" style="fill:#9ca3af">YARN</text>
<text x="330" y="439" class="s">resourcemanager, nodemanager: idle for Spark here</text>
<circle cx="44" cy="493" r="10" fill="#f5b301" stroke="#ffffff" stroke-width="2"/>
<text x="44" y="497.5" class="n" text-anchor="middle">1</text>
<text x="64" y="498" class="b">The driver asks the NameNode where the file's blocks are (hdfs://namenode:8020).</text>
<circle cx="44" cy="515" r="10" fill="#f5b301" stroke="#ffffff" stroke-width="2"/>
<text x="44" y="519.5" class="n" text-anchor="middle">2</text>
<text x="64" y="520" class="b">Tasks read the blocks straight from the DataNode, one task per block or split.</text>
<circle cx="44" cy="537" r="10" fill="#f5b301" stroke="#ffffff" stroke-width="2"/>
<text x="44" y="541.5" class="n" text-anchor="middle">3</text>
<text x="64" y="542" class="b">Results, for example Parquet files, are written back to HDFS.</text>
</svg>
