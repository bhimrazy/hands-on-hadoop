<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
<title id="title">Docker memory budget per profile</title>
<desc id="desc">On a 2.85 GB Docker VM the core idles at about 1.25 GB and peaks near 2.2 GB during a job. Each add-on adds 0.3 to 0.9 GB, so core plus one add-on fits; two add-ons need about 4 GB.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.t{font-size:21px;font-weight:700}
.st{font-size:14px;fill:#6b7280}
.h{font-size:15px;font-weight:600}
.hs{font-size:14px;font-weight:600}
.b{font-size:14px}
.s{font-size:13px;fill:#6b7280}
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px}
.ms{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px;fill:#6b7280}
.n{font-size:13px;font-weight:700;fill:#ffffff}</style>
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.08"/></filter><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#e8efff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#2563eb" stroke-width="2.5" opacity="0.35"/></pattern></defs>
<rect width="800" height="620" fill="#ffffff"/>
<text x="32" y="44" class="t">Memory budget: core + one add-on</text>
<text x="32" y="68" class="st">Measured with docker stats on a Docker VM with 2.85 GB of memory.</text>
<line x1="252" y1="104" x2="252" y2="440" stroke="#eef0f3" stroke-width="1" stroke-linecap="round"/>
<text x="252" y="460" class="s" text-anchor="middle">0 GB</text>
<line x1="352" y1="104" x2="352" y2="440" stroke="#eef0f3" stroke-width="1" stroke-linecap="round"/>
<text x="352" y="460" class="s" text-anchor="middle">1 GB</text>
<line x1="452" y1="104" x2="452" y2="440" stroke="#eef0f3" stroke-width="1" stroke-linecap="round"/>
<text x="452" y="460" class="s" text-anchor="middle">2 GB</text>
<line x1="552" y1="104" x2="552" y2="440" stroke="#eef0f3" stroke-width="1" stroke-linecap="round"/>
<text x="552" y="460" class="s" text-anchor="middle">3 GB</text>
<line x1="652" y1="104" x2="652" y2="440" stroke="#eef0f3" stroke-width="1" stroke-linecap="round"/>
<text x="652" y="460" class="s" text-anchor="middle">4 GB</text>
<text x="32" y="137" class="b">Core, idle</text>
<rect x="252" y="120" width="125" height="24" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="664" y="137" class="s">1.25 GB</text>
<text x="32" y="177" class="b">Core, running a job</text>
<rect x="252" y="160" width="125" height="24" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="377" y="160" width="95" height="24" rx="4" fill="url(#hatch)" stroke="#2563eb" stroke-width="1.2"/>
<text x="664" y="177" class="s">2.2 GB peak</text>
<text x="32" y="217" class="b">+ history</text>
<rect x="252" y="200" width="125" height="24" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="377" y="200" width="30" height="24" rx="4" fill="#e8efff" stroke="#2563eb" stroke-width="1.2"/>
<text x="664" y="217" class="s">+0.3 GB</text>
<text x="32" y="257" class="b">+ notebook</text>
<rect x="252" y="240" width="125" height="24" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="377" y="240" width="83" height="24" rx="4" fill="#fff1e8" stroke="#e8590c" stroke-width="1.2"/>
<text x="664" y="257" class="s">+0.8 GB</text>
<text x="32" y="297" class="b">+ hive</text>
<rect x="252" y="280" width="125" height="24" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="377" y="280" width="90" height="24" rx="4" fill="#fdf3e2" stroke="#b45309" stroke-width="1.2"/>
<text x="664" y="297" class="s">+0.9 GB</text>
<text x="32" y="337" class="b">+ kafka + notebook (lab 09)</text>
<rect x="252" y="320" width="125" height="24" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="377" y="320" width="48" height="24" rx="4" fill="#eef2f6" stroke="#334155" stroke-width="1.2"/>
<rect x="425" y="320" width="83" height="24" rx="4" fill="#fff1e8" stroke="#e8590c" stroke-width="1.2"/>
<text x="664" y="337" class="s">+1.3 GB, tight</text>
<text x="32" y="377" class="b">cluster, HDFS only (lab 04)</text>
<rect x="252" y="360" width="135" height="24" rx="4" fill="#fff7db" stroke="#f5b301" stroke-width="1.2"/>
<text x="664" y="377" class="s">1.35 GB total</text>
<text x="32" y="417" class="b">Two add-ons: hive + notebook</text>
<rect x="252" y="400" width="125" height="24" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="377" y="400" width="90" height="24" rx="4" fill="#fdf3e2" stroke="#b45309" stroke-width="1.2"/>
<rect x="467" y="400" width="83" height="24" rx="4" fill="#fff1e8" stroke="#e8590c" stroke-width="1.2"/>
<rect x="537" y="400" width="13" height="24" rx="0" fill="#dc2626" opacity="0.35"/>
<text x="664" y="417" class="hs" style="fill:#b91c1c">needs ~4 GB</text>
<line x1="537" y1="98" x2="537" y2="440" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="531" y="106" class="hs" text-anchor="end" style="fill:#b91c1c">Docker VM 2.85 GB</text>
<rect x="32" y="494" width="16" height="14" rx="3" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="54" y="506" class="s">core services</text>
<rect x="165.26" y="494" width="16" height="14" rx="3" fill="url(#hatch)" stroke="#2563eb" stroke-width="1.2"/>
<text x="187.26" y="506" class="s">a running job</text>
<rect x="298.52" y="494" width="16" height="14" rx="3" fill="#e8efff" stroke="#2563eb" stroke-width="1.2"/>
<text x="320.52" y="506" class="s">history</text>
<rect x="389.66" y="494" width="16" height="14" rx="3" fill="#fff1e8" stroke="#e8590c" stroke-width="1.2"/>
<text x="411.66" y="506" class="s">notebook</text>
<rect x="487.82" y="494" width="16" height="14" rx="3" fill="#fdf3e2" stroke="#b45309" stroke-width="1.2"/>
<text x="509.82" y="506" class="s">hive</text>
<rect x="557.9" y="494" width="16" height="14" rx="3" fill="#eef2f6" stroke="#334155" stroke-width="1.2"/>
<text x="579.9" y="506" class="s">kafka</text>
<rect x="635" y="494" width="16" height="14" rx="3" fill="#fff7db" stroke="#f5b301" stroke-width="1.2"/>
<text x="657" y="506" class="s">cluster</text>
<rect x="32" y="528" width="360" height="60" rx="12" fill="#eaf7ee" stroke="#16a34a" stroke-width="1.5"/>
<text x="48" y="552" class="hs" style="fill:#15803d">Fits: core + any one add-on</text>
<text x="48" y="573" class="s">Stop one add-on before you start the next.</text>
<rect x="408" y="528" width="360" height="60" rx="12" fill="#fdecec" stroke="#dc2626" stroke-width="1.5"/>
<text x="424" y="552" class="hs" style="fill:#b91c1c">Two add-ons at once: give Docker ~4 GB</text>
<text x="424" y="573" class="s">Docker Desktop → Settings → Resources</text>
</svg>
