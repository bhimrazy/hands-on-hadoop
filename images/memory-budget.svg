<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
<title id="title">Docker memory budget per profile</title>
<desc id="desc">Bar chart on a 0 to 4 GB scale with a 2.85 GB Docker VM marked. The core idles at about 1.25 GB and peaks near 2.2 GB during a job. Core plus any one add-on peaks between 2.3 and 2.4 GB and fits; two add-ons together go past 3 GB and need about 4 GB.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.t{font-size:21px;font-weight:700}
.st{font-size:14px;fill:#5f6877}
.h{font-size:15px;font-weight:600}
.hs{font-size:14px;font-weight:600}
.b{font-size:14px}
.s{font-size:13.5px;fill:#5f6877}
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13.5px}
.ms{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13.5px;fill:#5f6877}
.n{font-size:13px;font-weight:700;fill:#ffffff}</style>
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.08"/></filter><pattern id="peak" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9ca3af" stroke-width="2.5" opacity="0.45"/></pattern><pattern id="over" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#dc2626" stroke-width="2.5" opacity="0.45"/></pattern></defs>
<rect width="800" height="580" fill="#ffffff"/>
<text x="32" y="44" class="t">Memory budget: core + one add-on</text>
<text x="32" y="68" class="st">Solid bars are idle use, hatched is the peak while working. Measured on a 2.85 GB Docker VM.</text>
<line x1="252" y1="104" x2="252" y2="400" stroke="#eef0f3" stroke-width="1" stroke-linecap="round"/>
<text x="252" y="420" class="s" text-anchor="middle">0 GB</text>
<line x1="352" y1="104" x2="352" y2="400" stroke="#eef0f3" stroke-width="1" stroke-linecap="round"/>
<text x="352" y="420" class="s" text-anchor="middle">1 GB</text>
<line x1="452" y1="104" x2="452" y2="400" stroke="#eef0f3" stroke-width="1" stroke-linecap="round"/>
<text x="452" y="420" class="s" text-anchor="middle">2 GB</text>
<line x1="552" y1="104" x2="552" y2="400" stroke="#eef0f3" stroke-width="1" stroke-linecap="round"/>
<text x="552" y="420" class="s" text-anchor="middle">3 GB</text>
<line x1="652" y1="104" x2="652" y2="400" stroke="#eef0f3" stroke-width="1" stroke-linecap="round"/>
<text x="652" y="420" class="s" text-anchor="middle">4 GB</text>
<text x="32" y="137" class="b">Core only (labs 01, 02, 10)</text>
<rect x="252" y="120" width="125" height="24" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="377" y="120" width="95" height="24" rx="4" fill="url(#peak)" stroke="#9ca3af" stroke-width="1.2"/>
<text x="664" y="137" class="s">peak 2.2 GB</text>
<text x="32" y="177" class="b">+ history (lab 03)</text>
<rect x="252" y="160" width="125" height="24" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="377" y="160" width="30" height="24" rx="4" fill="#e8efff" stroke="#2563eb" stroke-width="1.2"/>
<rect x="407" y="160" width="80" height="24" rx="4" fill="url(#peak)" stroke="#9ca3af" stroke-width="1.2"/>
<text x="664" y="177" class="s">peak 2.35 GB</text>
<text x="32" y="217" class="b">+ notebook (labs 05, 06, 08)</text>
<rect x="252" y="200" width="125" height="24" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="377" y="200" width="65" height="24" rx="4" fill="#fff1e8" stroke="#e8590c" stroke-width="1.2"/>
<rect x="442" y="200" width="40" height="24" rx="4" fill="url(#peak)" stroke="#9ca3af" stroke-width="1.2"/>
<text x="664" y="217" class="s">peak 2.3 GB</text>
<text x="32" y="257" class="b">+ hive (lab 07)</text>
<rect x="252" y="240" width="125" height="24" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="377" y="240" width="70" height="24" rx="4" fill="#fdf3e2" stroke="#b45309" stroke-width="1.2"/>
<rect x="447" y="240" width="45" height="24" rx="4" fill="url(#peak)" stroke="#9ca3af" stroke-width="1.2"/>
<text x="664" y="257" class="s">peak 2.4 GB</text>
<text x="32" y="297" class="b">+ kafka + notebook (lab 09)</text>
<rect x="252" y="280" width="125" height="24" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="377" y="280" width="33" height="24" rx="4" fill="#eef2f6" stroke="#334155" stroke-width="1.2"/>
<rect x="410" y="280" width="65" height="24" rx="4" fill="#fff1e8" stroke="#e8590c" stroke-width="1.2"/>
<rect x="475" y="280" width="12" height="24" rx="4" fill="url(#peak)" stroke="#9ca3af" stroke-width="1.2"/>
<text x="664" y="297" class="s">peak 2.35 GB</text>
<text x="32" y="337" class="b">cluster, HDFS only (lab 04)</text>
<rect x="252" y="320" width="135" height="24" rx="4" fill="#fff7db" stroke="#f5b301" stroke-width="1.2"/>
<rect x="387" y="320" width="5" height="24" rx="4" fill="url(#peak)" stroke="#9ca3af" stroke-width="1.2"/>
<text x="664" y="337" class="s">peak 1.4 GB</text>
<text x="32" y="377" class="b">Two add-ons: hive + notebook</text>
<rect x="252" y="360" width="125" height="24" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="377" y="360" width="70" height="24" rx="4" fill="#fdf3e2" stroke="#b45309" stroke-width="1.2"/>
<rect x="447" y="360" width="65" height="24" rx="4" fill="#fff1e8" stroke="#e8590c" stroke-width="1.2"/>
<rect x="512" y="360" width="70" height="24" rx="4" fill="url(#over)" stroke="#dc2626" stroke-width="1.2"/>
<text x="664" y="377" class="hs" style="fill:#b91c1c">over 3 GB</text>
<line x1="537" y1="98" x2="537" y2="400" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="531" y="106" class="hs" text-anchor="end" style="fill:#b91c1c">Docker VM 2.85 GB</text>
<rect x="32" y="452" width="16" height="14" rx="3" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="54" y="464" class="s">core</text>
<rect x="105.16" y="452" width="16" height="14" rx="3" fill="#e8efff" stroke="#2563eb" stroke-width="1.2"/>
<text x="127.16" y="464" class="s">history</text>
<rect x="200.19" y="452" width="16" height="14" rx="3" fill="#fff1e8" stroke="#e8590c" stroke-width="1.2"/>
<text x="222.19" y="464" class="s">notebook</text>
<rect x="302.51" y="452" width="16" height="14" rx="3" fill="#fdf3e2" stroke="#b45309" stroke-width="1.2"/>
<text x="324.51" y="464" class="s">hive</text>
<rect x="375.67" y="452" width="16" height="14" rx="3" fill="#eef2f6" stroke="#334155" stroke-width="1.2"/>
<text x="397.67" y="464" class="s">kafka</text>
<rect x="456.12" y="452" width="16" height="14" rx="3" fill="#fff7db" stroke="#f5b301" stroke-width="1.2"/>
<text x="478.12" y="464" class="s">cluster</text>
<rect x="551.15" y="452" width="16" height="14" rx="3" fill="url(#peak)" stroke="#9ca3af" stroke-width="1.2"/>
<text x="573.15" y="464" class="s">peak while working</text>
<rect x="32" y="488" width="360" height="60" rx="12" fill="#eaf7ee" stroke="#16a34a" stroke-width="1.5"/>
<text x="48" y="512" class="hs" style="fill:#15803d">Fits: core + any one add-on</text>
<text x="48" y="533" class="s">Stop one add-on before you start the next.</text>
<rect x="408" y="488" width="360" height="60" rx="12" fill="#fdecec" stroke="#dc2626" stroke-width="1.5"/>
<text x="424" y="512" class="hs" style="fill:#b91c1c">Two add-ons at once: give Docker ~4 GB</text>
<text x="424" y="533" class="s">Docker Desktop → Settings → Resources</text>
</svg>
