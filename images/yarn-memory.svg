<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
<title id="title">How YARN splits NodeManager memory into containers</title>
<desc id="desc">The nodemanager container has a 1 GB Docker limit: about 256 MB for the NodeManager itself and 768 MB for YARN containers, handed out in 128 MB steps. One job's AM (384 MB) and a map task (256 MB) leave 128 MB free, so a second job's AM waits in ACCEPTED.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.t{font-size:21px;font-weight:700}
.st{font-size:14px;fill:#6b7280}
.h{font-size:15px;font-weight:600}
.hs{font-size:14px;font-weight:600}
.b{font-size:14px}
.s{font-size:13px;fill:#6b7280}
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px}
.ms{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px;fill:#6b7280}
.n{font-size:13px;font-weight:700;fill:#ffffff}</style>
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.08"/></filter><marker id="adc2626" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5 0.8 L9 5 L0.5 9.2 z" fill="#dc2626"/></marker></defs>
<rect width="800" height="620" fill="#ffffff"/>
<text x="32" y="44" class="t">How the NodeManager's memory is shared</text>
<text x="32" y="68" class="st">YARN hands out memory as containers. A job waits in ACCEPTED when no container fits.</text>
<text x="40" y="106" class="h">nodemanager container · Docker limit 1 GB</text>
<rect x="40" y="118" width="720" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<rect x="44" y="122" width="172" height="62" rx="7" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="130" y="149" class="hs" text-anchor="middle">NodeManager JVM</text>
<text x="130" y="169" class="s" text-anchor="middle">~256 MB</text>
<rect x="220" y="122" width="536" height="62" rx="7" fill="#e8efff" stroke="#2563eb" stroke-width="1.2"/>
<line x1="310" y1="126" x2="310" y2="134" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
<line x1="310" y1="172" x2="310" y2="180" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
<line x1="400" y1="126" x2="400" y2="134" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
<line x1="400" y1="172" x2="400" y2="180" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
<line x1="490" y1="126" x2="490" y2="134" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
<line x1="490" y1="172" x2="490" y2="180" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
<line x1="580" y1="126" x2="580" y2="134" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
<line x1="580" y1="172" x2="580" y2="180" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
<line x1="670" y1="126" x2="670" y2="134" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
<line x1="670" y1="172" x2="670" y2="180" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
<text x="490" y="149" class="hs" text-anchor="middle" style="fill:#1d4ed8">768 MB for containers</text>
<text x="490" y="169" class="s" text-anchor="middle">handed out in 128 MB steps</text>
<text x="40" y="236" class="h">One wordcount job</text>
<text x="40" y="256" class="s">AM + one map task</text>
<rect x="222" y="224" width="266" height="52" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.2"/>
<text x="355" y="248" class="hs" text-anchor="middle" style="fill:#ffffff">ApplicationMaster</text>
<text x="355" y="266" class="s" text-anchor="middle" style="fill:#dbe6ff">384 MB · heap 288m</text>
<rect x="492" y="224" width="176" height="52" rx="6" fill="#e8efff" stroke="#2563eb" stroke-width="1.2"/>
<text x="580" y="248" class="hs" text-anchor="middle" style="fill:#1f2937">map task</text>
<text x="580" y="266" class="s" text-anchor="middle" style="fill:#6b7280">256 MB · heap 200m</text>
<rect x="672" y="224" width="86" height="52" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="715" y="248" class="hs" text-anchor="middle" style="fill:#1d4ed8">free</text>
<text x="715" y="266" class="s" text-anchor="middle">128 MB</text>
<text x="220" y="304" class="s">The next map task (256 MB) waits for this one to finish.</text>
<text x="40" y="352" class="h">A second job</text>
<text x="40" y="372" class="s">arrives</text>
<rect x="222" y="340" width="266" height="52" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.2"/>
<text x="355" y="364" class="hs" text-anchor="middle" style="fill:#ffffff">job 1 AM</text>
<text x="355" y="382" class="s" text-anchor="middle" style="fill:#dbe6ff">384 MB</text>
<rect x="492" y="340" width="176" height="52" rx="6" fill="#e8efff" stroke="#2563eb" stroke-width="1.2"/>
<text x="580" y="364" class="hs" text-anchor="middle" style="fill:#1f2937">job 1 map</text>
<text x="580" y="382" class="s" text-anchor="middle" style="fill:#6b7280">256 MB</text>
<rect x="672" y="340" width="86" height="52" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="715" y="364" class="hs" text-anchor="middle" style="fill:#1d4ed8">free</text>
<text x="715" y="382" class="s" text-anchor="middle">128 MB</text>
<rect x="222" y="410" width="266" height="44" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="355" y="437" class="hs" text-anchor="middle" style="fill:#b91c1c">job 2 AM needs 384 MB</text>
<path d="M498 432 L530 432" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#adc2626)"/>
<text x="540" y="428" class="hs" style="fill:#b91c1c">ACCEPTED: stays in the queue</text>
<text x="540" y="447" class="s">until 384 MB is free</text>
<rect x="32" y="480" width="736" height="120" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
<text x="48" y="504" class="m">yarn.nodemanager.resource.memory-mb</text>
<text x="400" y="504" class="m" text-anchor="end" style="fill:#1d4ed8">768</text>
<text x="48" y="524" class="m">yarn.scheduler.minimum-allocation-mb</text>
<text x="400" y="524" class="m" text-anchor="end" style="fill:#1d4ed8">128</text>
<text x="48" y="544" class="m">yarn.app.mapreduce.am.resource.mb</text>
<text x="400" y="544" class="m" text-anchor="end" style="fill:#1d4ed8">384</text>
<text x="48" y="564" class="m">mapreduce.map.memory.mb</text>
<text x="400" y="564" class="m" text-anchor="end" style="fill:#1d4ed8">256</text>
<text x="48" y="584" class="m">mapreduce.reduce.memory.mb</text>
<text x="400" y="584" class="m" text-anchor="end" style="fill:#1d4ed8">256</text>
<text x="432" y="504" class="hs">Lab 10 changes these in compose.yaml</text>
<text x="432" y="526" class="s">and recreates the YARN containers.</text>
<text x="432" y="552" class="s">Requests round up to 128 MB steps.</text>
<text x="432" y="574" class="s">Heap (-Xmx) ≈ 75% of a container.</text>
</svg>
