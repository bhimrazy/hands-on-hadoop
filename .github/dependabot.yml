version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "deps(ci)"
    groups:
      ci-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /notebook
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "deps(docker)"
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - compose
    commit-message:
      prefix: "deps(compose)"
    groups:
      compose-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: uv
    directory: /notebook
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps(python)"
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
