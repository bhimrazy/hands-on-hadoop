name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          shellcheck: true
          pyflakes: false

  hadolint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: notebook/Dockerfile
          failure-threshold: warning

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shopt -s globstar nullglob
          files=(scripts/*.sh labs/**/*.sh tests/**/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shell scripts found"
            exit 1
          fi
          shellcheck --version
          shellcheck -x --severity=warning "${files[@]}"

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: core
        run: docker compose config -q
      - name: all profiles
        run: docker compose --profile "*" config -q

  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 20
            --accept 200..=299,403,429
            --exclude '^https?://([a-z0-9-]+\.)?localhost'
            --exclude '^https?://127\.0\.0\.1'
            --exclude '^https://github\.com/bhimrazy/hands-on-hadoop/(issues/new|security/advisories/new)'
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notebook-outputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: notebooks have no outputs
        run: |
          shopt -s globstar nullglob
          bad=0
          for nb in labs/**/*.ipynb; do
            if ! jq -e '[.cells[] | select(.cell_type == "code") | select((.outputs | length) > 0 or .execution_count != null)] | length == 0' "$nb" >/dev/null; then
              echo "::error file=$nb::notebook has outputs or execution counts; clear them before committing"
              bad=1
            fi
          done
          exit "$bad"
